
services:
  backend1:
    image: simple-blockchain-node:runtime
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      SERVER_PORT: 3333
      NODE_LIBP2P_PORT: 4001
      NODE_PEERS: ""
      NODE_JWT_SECRET: changeMeSuperSecret_changeMeSuperSecret
      NODE_WALLET_PASSWORD: changeMeSuperSecret
      NODE_DATA_PATH: data1
      CONSENSUS_COINBASE_MATURITY: 0
    ports:
      - "3333:3333"
      - "4001:4001"
    volumes:
      - ./data1:/app/data1
      - ./wallet1:/root/.simple-chain
  frontend1:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        VITE_NODE_URL: http://localhost:3333/api
        VITE_NODE_RPC_HTTP: http://localhost:3333/rpc
        VITE_NODE_JWT_SECRET: changeMeSuperSecret_changeMeSuperSecret
    ports:
      - "8081:80"
    depends_on:
      - backend1

  backend2:
    image: simple-blockchain-node:runtime
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      - backend1
    environment:
      SERVER_PORT: 3334
      NODE_LIBP2P_PORT: 4002
      NODE_PEERS: "${BACKEND1_MULTIADDR:-backend1:4001}"
      NODE_JWT_SECRET: changeMeSuperSecret_changeMeSuperSecret
      NODE_WALLET_PASSWORD: changeMeSuperSecret
      NODE_DATA_PATH: data2
      CONSENSUS_COINBASE_MATURITY: 0
    ports:
      - "3334:3334"
      - "4002:4002"
    volumes:
      - ./data2:/app/data2
      - ./wallet2:/root/.simple-chain
  frontend2:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        VITE_NODE_URL: http://localhost:3334/api
        VITE_NODE_RPC_HTTP: http://localhost:3334/rpc
        VITE_NODE_JWT_SECRET: changeMeSuperSecret_changeMeSuperSecret
    ports:
      - "8082:80"
    depends_on:
      - backend2
