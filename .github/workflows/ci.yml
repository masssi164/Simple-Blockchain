name: CI

on:
  push:
    branches: [ "main", "work" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build project
        run: ./gradlew build --no-daemon
      - name: Start services
        run: ./gradlew composeUp --no-daemon
      - name: Run pipeline
        run: make ci
      - name: Show logs
        if: always()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: ./gradlew composeDown --no-daemon
